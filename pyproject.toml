[project]
name = "nlp-hackathon"
version = "0.1.0"
description = "Text-to-SPARQL prototype for the FS26 NLP hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "rdflib>=7.1.4",
  "streamlit>=1.51.0",
]

[project.scripts]
nlp-hackathon = "nlp_hackathon.submission:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nlp_hackathon"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
